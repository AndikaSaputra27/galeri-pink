<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeri Foto Elegan 🌸</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap');

    :root {
      --pink-light: #fce4ec;
      --pink-mid: #f48fb1;
      --pink-dark: #e91e8c;
      --pink-rose: #f06292;
      --pink-blush: #ffd6e7;
      --gold: #c9a96e;
      --white: #fff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 30%, #ffd6e7 60%, #fce4ec 100%);
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
    }

    /* ── CONFETTI CANVAS ── */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 60px 20px 30px;
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.6);
      border: 1px solid var(--pink-mid);
      border-radius: 50px;
      padding: 6px 22px;
      font-size: 0.78rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--pink-dark);
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.8rem);
      color: #b5175e;
      text-shadow: 0 2px 12px rgba(233,30,140,0.15);
      margin-bottom: 10px;
    }

    header h1 span {
      font-style: italic;
      color: var(--pink-rose);
    }

    header p {
      font-size: 1rem;
      color: #c2698f;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--pink-mid), transparent);
      margin: 18px auto 0;
    }

    /* ── MAIN CONTAINER ── */
    .container {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 20px 60px;
    }

    /* ── GRID ── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      margin-bottom: 40px;
    }

    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    }
    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }

    /* ── CARD ── */
    .card {
      position: relative;
      background: rgba(255,255,255,0.75);
      border: 1.5px solid rgba(244,143,177,0.4);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(233,30,140,0.10), 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      backdrop-filter: blur(8px);
      aspect-ratio: 4/3;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 50px rgba(233,30,140,0.20), 0 6px 20px rgba(0,0,0,0.10);
    }

    .card-number {
      position: absolute;
      top: 12px; left: 14px;
      background: rgba(255,255,255,0.85);
      color: var(--pink-dark);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 3px 10px;
      border-radius: 20px;
      z-index: 5;
      border: 1px solid rgba(244,143,177,0.5);
    }

    /* Upload placeholder */
    .upload-area {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(145deg, rgba(252,228,236,0.8), rgba(255,214,231,0.8));
      transition: background 0.3s;
    }

    .upload-area:hover { background: linear-gradient(145deg, rgba(244,143,177,0.25), rgba(252,228,236,0.9)); }

    .upload-icon {
      font-size: 2.4rem;
      line-height: 1;
    }

    .upload-label {
      font-size: 0.82rem;
      color: #c2698f;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: center;
      padding: 0 10px;
    }

    .upload-sub {
      font-size: 0.70rem;
      color: #e091b2;
      letter-spacing: 0.3px;
    }

    /* Hidden file input */
    .file-input {
      display: none;
    }

    /* Uploaded image */
    .card-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .card:hover .card-img { transform: scale(1.06); }

    /* Overlay on hover */
    .card-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(181,23,94,0.75) 0%, transparent 100%);
      padding: 20px 16px 14px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 4;
    }

    .card:hover .card-overlay {
      opacity: 1;
      transform: translateY(0);
    }

    .overlay-action {
      display: flex;
      gap: 10px;
    }

    .btn-small {
      flex: 1;
      padding: 7px 0;
      border: none;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-small:hover { opacity: 0.88; transform: scale(0.97); }

    .btn-view {
      background: rgba(255,255,255,0.9);
      color: #b5175e;
    }

    .btn-remove {
      background: rgba(233,30,140,0.85);
      color: white;
    }

    /* ── SHARE SECTION ── */
    .share-section {
      background: rgba(255,255,255,0.65);
      border: 1.5px solid rgba(244,143,177,0.5);
      border-radius: 24px;
      padding: 36px 40px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(233,30,140,0.10);
    }

    .share-section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: #b5175e;
      margin-bottom: 8px;
    }

    .share-section p {
      color: #c2698f;
      font-size: 0.88rem;
      margin-bottom: 24px;
    }

    .share-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .btn-share {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 26px;
      border: none;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s;
      letter-spacing: 0.4px;
    }

    .btn-share:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(233,30,140,0.30);
    }

    .btn-copy {
      background: linear-gradient(135deg, #f48fb1, #e91e8c);
      color: white;
    }

    .btn-wa {
      background: #25D366;
      color: white;
    }

    .btn-ig {
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
    }

    .btn-download {
      background: linear-gradient(135deg, #c9a96e, #e0c080);
      color: white;
    }

    /* URL input */
    .url-box {
      display: flex;
      gap: 10px;
      max-width: 520px;
      margin: 0 auto;
      align-items: center;
    }

    .url-input {
      flex: 1;
      padding: 12px 18px;
      border: 1.5px solid rgba(244,143,177,0.6);
      border-radius: 50px;
      background: rgba(255,255,255,0.8);
      font-size: 0.82rem;
      color: #a0356d;
      outline: none;
      font-family: 'Lato', sans-serif;
    }

    .url-input:focus {
      border-color: var(--pink-dark);
      box-shadow: 0 0 0 3px rgba(233,30,140,0.10);
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    .lightbox.active { display: flex; }

    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-close {
      position: absolute;
      top: 12px; right: 14px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 50%;
      width: 36px; height: 36px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #b5175e;
      transition: background 0.2s;
    }

    .lightbox-close:hover { background: white; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: linear-gradient(135deg, #e91e8c, #f48fb1);
      color: white;
      padding: 13px 28px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
      box-shadow: 0 8px 24px rgba(233,30,140,0.35);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 30px 20px;
      color: #d47fa6;
      font-size: 0.78rem;
      letter-spacing: 1px;
    }

    /* ── DECORATIVE PETALS ── */
    .petal {
      position: fixed;
      pointer-events: none;
      font-size: 1.4rem;
      z-index: 1;
      animation: floatPetal linear infinite;
      opacity: 0.45;
    }

    @keyframes floatPetal {
      0%   { transform: translateY(-40px) rotate(0deg);   opacity: 0; }
      10%  { opacity: 0.45; }
      90%  { opacity: 0.45; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- Confetti Canvas -->
<canvas id="confetti-canvas"></canvas>

<!-- Header -->
<header>
  <div class="header-badge">✦ Galeri Foto ✦</div>
  <h1>Kenangan <span>Indah</span> Kita</h1>
  <p>Kumpulan momen berharga yang tak terlupakan</p>
  <div class="divider"></div>
</header>

<!-- Main -->
<div class="container">

  <!-- Gallery Grid -->
  <div class="gallery-grid" id="galleryGrid">
    <!-- Cards will be generated by JS -->
  </div>

  <!-- Share Section -->
  <div class="share-section">
    <h2>🌸 Bagikan Galeri Ini</h2>
    <p>Simpan & bagikan momen indah ini kepada semua orang</p>

    <div class="share-buttons">
      <button class="btn-share btn-copy" onclick="copyLink()">
        🔗 Salin Link
      </button>
      <button class="btn-share btn-wa" onclick="shareWhatsApp()">
        💬 WhatsApp
      </button>
      <button class="btn-share btn-ig" onclick="shareInstagram()">
        📸 Instagram
      </button>
      <button class="btn-share btn-download" onclick="downloadPage()">
        ⬇️ Unduh Halaman
      </button>
    </div>

    <div class="url-box">
      <input class="url-input" id="pageUrl" type="text" readonly placeholder="URL halaman ini…" />
      <button class="btn-share btn-copy" style="padding:11px 20px;flex-shrink:0;font-size:0.8rem" onclick="copyLink()">Salin</button>
    </div>
  </div>

</div>

<!-- Footer -->
<footer>
  🌸 Dibuat dengan cinta — Galeri Foto Elegan 🌸
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lightbox-inner" onclick="event.stopPropagation()">
    <img class="lightbox-img" id="lightboxImg" src="" alt="Preview" />
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  /* ─────────────────────────────────────────
     GALLERY DATA — saved to localStorage
  ───────────────────────────────────────── */
  const TOTAL_SLOTS = 6;
  let images = JSON.parse(localStorage.getItem('gallery_images') || '[]');
  // Ensure array length = TOTAL_SLOTS
  while (images.length < TOTAL_SLOTS) images.push(null);
  images = images.slice(0, TOTAL_SLOTS);

  const LABELS = [
    'Foto 1', 'Foto 2', 'Foto 3',
    'Foto 4', 'Foto 5', 'Foto 6'
  ];

  function saveImages() {
    localStorage.setItem('gallery_images', JSON.stringify(images));
  }

  function renderGallery() {
    const grid = document.getElementById('galleryGrid');
    grid.innerHTML = '';

    images.forEach((src, i) => {
      const card = document.createElement('div');
      card.className = 'card';

      const num = document.createElement('span');
      num.className = 'card-number';
      num.textContent = `0${i + 1}`;

      if (src) {
        // Image loaded
        const img = document.createElement('img');
        img.className = 'card-img';
        img.src = src;
        img.alt = LABELS[i];

        const overlay = document.createElement('div');
        overlay.className = 'card-overlay';
        overlay.innerHTML = `
          <div class="overlay-action">
            <button class="btn-small btn-view" onclick="openLightbox(${i})">🔍 Lihat</button>
            <button class="btn-small btn-remove" onclick="removeImage(${i})">🗑 Hapus</button>
          </div>`;

        card.appendChild(num);
        card.appendChild(img);
        card.appendChild(overlay);
        card.addEventListener('click', () => openLightbox(i));
      } else {
        // Upload placeholder
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.className = 'file-input';
        fileInput.id = `file-${i}`;
        fileInput.addEventListener('change', (e) => handleUpload(e, i));

        const uploadArea = document.createElement('label');
        uploadArea.htmlFor = `file-${i}`;
        uploadArea.className = 'upload-area';
        uploadArea.innerHTML = `
          <div class="upload-icon">🌸</div>
          <div class="upload-label">${LABELS[i]}</div>
          <div class="upload-sub">Klik untuk memilih foto</div>`;

        card.appendChild(num);
        card.appendChild(fileInput);
        card.appendChild(uploadArea);
      }

      grid.appendChild(card);
    });
  }

  function handleUpload(event, index) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      images[index] = e.target.result;
      saveImages();
      renderGallery();
      showToast('🌸 Foto berhasil diunggah!');
    };
    reader.readAsDataURL(file);
  }

  function removeImage(index) {
    images[index] = null;
    saveImages();
    renderGallery();
    showToast('Foto dihapus.');
  }

  /* ─────────────────────────────────────────
     LIGHTBOX
  ───────────────────────────────────────── */
  function openLightbox(index) {
    if (!images[index]) return;
    document.getElementById('lightboxImg').src = images[index];
    document.getElementById('lightbox').classList.add('active');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });

  /* ─────────────────────────────────────────
     SHARE FUNCTIONS
  ───────────────────────────────────────── */
  function getPageUrl() {
    return window.location.href;
  }

  document.getElementById('pageUrl').value = window.location.href;

  function copyLink() {
    const url = getPageUrl();
    navigator.clipboard.writeText(url).then(() => {
      showToast('🔗 Link berhasil disalin!');
    }).catch(() => {
      // Fallback
      const inp = document.getElementById('pageUrl');
      inp.select();
      document.execCommand('copy');
      showToast('🔗 Link berhasil disalin!');
    });
  }

  function shareWhatsApp() {
    const url = encodeURIComponent(getPageUrl());
    const text = encodeURIComponent('🌸 Lihat galeri foto elegan ini! ');
    window.open(`https://wa.me/?text=${text}${url}`, '_blank');
  }

  function shareInstagram() {
    copyLink();
    showToast('📸 Link disalin — tempel di bio Instagram kamu!');
  }

  function downloadPage() {
    const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'galeri-foto-elegan.html';
    a.click();
    showToast('⬇️ Halaman berhasil diunduh!');
  }

  /* ─────────────────────────────────────────
     TOAST
  ───────────────────────────────────────── */
  let toastTimeout;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ─────────────────────────────────────────
     CONFETTI
  ───────────────────────────────────────── */
  (function () {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const COLORS = [
      '#f48fb1','#e91e8c','#f06292','#fce4ec',
      '#c2698f','#ffd6e7','#fff0f6','#e040fb',
      '#f8bbd0','#c9a96e'
    ];

    const SHAPES = ['circle', 'rect', 'triangle', 'heart'];

    class Particle {
      constructor() { this.reset(true); }

      reset(init = false) {
        this.x      = Math.random() * canvas.width;
        this.y      = init ? Math.random() * canvas.height : -20;
        this.size   = Math.random() * 9 + 4;
        this.color  = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.speed  = Math.random() * 1.2 + 0.5;
        this.vx     = (Math.random() - 0.5) * 1.2;
        this.angle  = Math.random() * Math.PI * 2;
        this.spin   = (Math.random() - 0.5) * 0.10;
        this.alpha  = Math.random() * 0.5 + 0.5;
        this.shape  = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        this.wobble = Math.random() * Math.PI * 2;
      }

      update() {
        this.y      += this.speed;
        this.x      += this.vx + Math.sin(this.wobble) * 0.6;
        this.angle  += this.spin;
        this.wobble += 0.04;
        if (this.y > canvas.height + 30) this.reset();
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle   = this.color;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (this.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
          ctx.fill();

        } else if (this.shape === 'rect') {
          ctx.fillRect(-this.size / 2, -this.size / 4, this.size, this.size / 2);

        } else if (this.shape === 'triangle') {
          const s = this.size;
          ctx.beginPath();
          ctx.moveTo(0, -s / 2);
          ctx.lineTo(s / 2, s / 2);
          ctx.lineTo(-s / 2, s / 2);
          ctx.closePath();
          ctx.fill();

        } else if (this.shape === 'heart') {
          const s = this.size * 0.6;
          ctx.beginPath();
          ctx.moveTo(0, s * 0.35);
          ctx.bezierCurveTo( s,  -s * 0.3,  s * 1.6,  s * 0.7,  0,  s * 1.4);
          ctx.bezierCurveTo(-s * 1.6,  s * 0.7, -s,  -s * 0.3,  0,  s * 0.35);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    const COUNT = 90;
    const particles = Array.from({ length: COUNT }, () => new Particle());

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(loop);
    }
    loop();
  })();

  /* ─────────────────────────────────────────
     FLOATING PETALS (emoji)
  ───────────────────────────────────────── */
  (function () {
    const emojis = ['🌸','🌷','💗','🌺','💕','✨','🎀'];
    for (let i = 0; i < 12; i++) {
      const el = document.createElement('div');
      el.className = 'petal';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left  = `${Math.random() * 100}vw`;
      el.style.top   = `${Math.random() * 100}vh`;
      el.style.fontSize = `${Math.random() * 1.2 + 0.8}rem`;
      el.style.animationDuration = `${Math.random() * 12 + 8}s`;
      el.style.animationDelay   = `${Math.random() * 8}s`;
      document.body.appendChild(el);
    }
  })();

  /* ─────────────────────────────────────────
     INIT
  ───────────────────────────────────────── */
  renderGallery();
</script>
</body>
</html>
